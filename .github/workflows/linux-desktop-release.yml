# Build the app-only Ubuntu package from the exact release commit. This
# workflow uploads an artifact; scripts/release.sh remains the sole publisher.
name: Linux desktop release
run-name: Meru desktop ${{ inputs.version }} ${{ inputs.commit }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version, such as v0.4.12
        required: true
        type: string
      commit:
        description: Full commit to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Ubuntu desktop package
    runs-on: ubuntu-24.04
    steps:
      - name: Validate release identity
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: |
          [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit }}
      - name: Check exact commit
        env:
          COMMIT: ${{ inputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install desktop build libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential desktop-file-utils libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - name: Build and inspect package
        env:
          VERSION: ${{ inputs.version }}
          COMMIT: ${{ inputs.commit }}
        run: make desktop-deb VERSION="$VERSION" COMMIT="$COMMIT"
      - name: Check installed-program contracts
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test "$(bin/linux-amd64/meru-desktop --version)" = "$VERSION"
          desktop-file-validate deploy/linux/com.meru.desktop.desktop
          ldd bin/linux-amd64/meru-desktop > "$RUNNER_TEMP/meru-desktop-ldd.txt"
          ! grep -F 'not found' "$RUNNER_TEMP/meru-desktop-ldd.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: meru-desktop-${{ inputs.version }}-${{ inputs.commit }}
          path: dist/Meru-${{ inputs.version }}-linux-amd64.deb
          if-no-files-found: error
          retention-days: 7
