# CI: format, vet, lint, module hygiene, tests with coverage on Linux and
# macOS, a cross-compile for every release platform, both desktop builds,
# and the end-to-end tests. docs/ci.md explains each check and how to run it
# locally; most steps call a Makefile target so local runs and CI stay the same.

name: ci

on:
  push:
  pull_request:

# Read-only by default. No job here writes to the repository.
permissions:
  contents: read

# A new push to the same branch or pull request cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: format, vet, staticcheck, modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: staticcheck
        run: make lint
      - name: go mod verify and tidy
        run: make tidy-check

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go test -race with coverage
        run: make cover
      - name: coverage summary
        shell: bash
        run: |
          total="$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}')"
          {
            echo "### Coverage on ${{ matrix.os }}"
            echo
            echo "Total statement coverage: **${total}**"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.out
          retention-days: 14

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: go build ./cmd/...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o "bin/${GOOS}-${GOARCH}/" ./cmd/...

  # The desktop app uses Wails v3, which needs cgo and the system WebView,
  # so each supported system builds it with its own native libraries.
  desktop:
    name: desktop app (macOS)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: make desktop
        run: make desktop
      - name: make installer
        run: make installer
      - name: vet, staticcheck and govulncheck with the desktop tags
        run: make desktop-check

  desktop-ubuntu:
    name: desktop app (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install desktop build libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential desktop-file-utils libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - name: test the desktop command
        run: go test -tags 'desktop production' ./cmd/meru-desktop
      - name: build the Ubuntu desktop app
        run: make desktop-linux
      - name: build and inspect the app-only package
        env:
          COMMIT: ${{ github.sha }}
        run: |
          make desktop-deb VERSION=v0.0.0 COMMIT="$COMMIT"
          bash scripts/check-deb.sh v0.0.0 "$COMMIT" dist/Meru-v0.0.0-linux-amd64.deb
      - name: check desktop entry, AppArmor profile and shared libraries
        run: |
          desktop-file-validate deploy/linux/com.meru.desktop.desktop
          # -Q parses the profile without loading it; -K skips the cache.
          apparmor_parser -Q -K deploy/linux/meru-desktop.apparmor
          sh -n deploy/linux/postinst
          ldd bin/linux-amd64/meru-desktop > "$RUNNER_TEMP/meru-desktop-ldd.txt"
          ! grep -F 'not found' "$RUNNER_TEMP/meru-desktop-ldd.txt"

  installer:
    name: Ubuntu installer
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: test the release installer
        run: make install-script-test
      - name: verify the merud user service
        run: |
          mkdir -p "$HOME/.local/bin"
          go build -trimpath -o "$HOME/.local/bin/merud" ./cmd/merud
          systemd-analyze verify deploy/systemd/merud.service
      - name: install Podman for the Quadlet check
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
      - name: verify the SearXNG Quadlet
        run: |
          output="$(mktemp)"
          QUADLET_UNIT_DIRS="$PWD/deploy/systemd" \
            /usr/lib/systemd/system-generators/podman-system-generator --user --dryrun > "$output"
          grep -F 'meru-searxng.service' "$output"
          grep -F '127.0.0.1:8888:8080' "$output"
          grep -F '/.meru/searxng:/etc/searxng' "$output"
      - name: test the web address guard
        run: go test -race ./internal/builtin -run 'TestWebFetch|TestCheckPublic'

  e2e:
    name: end-to-end
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Builds merud, meru and fakeollama, then runs them as separate processes.
      - name: go test -tags e2e ./test/e2e/...
        run: make e2e

  actionlint:
    name: workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: actionlint
        run: make actionlint
